# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: clp-hosted-agent
services:
    clp-multi-agent-orchestrator:
        project: ./src/ClpHostedAgent
        host: azure.ai.agent
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: clp-multi-agent-orchestrator
        protocols:
            - protocol: responses
              version: 1.0.0
infra:
    provider: terraform
    path: ./infra-terraform
