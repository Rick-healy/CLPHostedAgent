# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: clp-multi-agent-orchestrator
displayName: "CLP Multi-Agent Orchestrator"
description: >
  Hosted multi-agent orchestrator for Contoso Labour Productivity (CLP).
  Routes questions to specialist sub-agents: ProductivityDataAgent for data queries
  and GeneralKnowledgeAgent for conceptual questions about CLP.
  Uses the Responses protocol with the Agent Framework in C#.
metadata:
  tags:
    - AI Agent Hosting
    - Responses Protocol
    - Agent Framework
    - .NET
    - Multi-Agent
    - Healthcare
template:
  name: clp-multi-agent-orchestrator
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-5.2
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
